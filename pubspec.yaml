name: mihan_abzar
description: فروشگاه میهن ابزار
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Database (Drift)
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.3
  path: ^1.9.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Dependency Injection
  get_it: ^7.7.0

  # Utility
  intl: ^0.19.0

  # Security
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.4.9
  analyzer: ^13.0.0

flutter:
  uses-material-design: true